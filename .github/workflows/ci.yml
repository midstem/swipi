name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Verify the published package
        run: npm run verify:package

  bundle-size-react:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Measure this branch
        working-directory: packages/react
        run: |
          cp scripts/report-size.mjs "$RUNNER_TEMP/report-size.mjs"
          node scripts/report-size.mjs --json "$RUNNER_TEMP/head-size.json"

      - name: Measure the base branch
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git checkout --force ${{ github.event.pull_request.base.sha }}
          npm ci
          npm run build
          if [ -d packages/react ]; then cd packages/react; fi
          node "$RUNNER_TEMP/report-size.mjs" --json "$RUNNER_TEMP/base-size.json"

      - name: Report
        run: |
          if [ -f "$RUNNER_TEMP/base-size.json" ]; then
            node "$RUNNER_TEMP/report-size.mjs" \
              --current "$RUNNER_TEMP/head-size.json" \
              --base "$RUNNER_TEMP/base-size.json" >> "$GITHUB_STEP_SUMMARY"
          else
            node "$RUNNER_TEMP/report-size.mjs" \
              --current "$RUNNER_TEMP/head-size.json" >> "$GITHUB_STEP_SUMMARY"
          fi

  react-compatibility:
    runs-on: ubuntu-latest
    name: react ${{ matrix.react }}
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pin React ${{ matrix.react }}
        run: |
          npm install --no-save --no-package-lock \
            react@${{ matrix.react }} \
            react-dom@${{ matrix.react }} \
            @types/react@${{ matrix.react }} \
            @types/react-dom@${{ matrix.react }}

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Typecheck the public API
        run: npm run typecheck:package

  bundle-size-vue:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Measure this branch
        working-directory: packages/vue
        run: |
          cp scripts/report-size.mjs "$RUNNER_TEMP/report-size.mjs"
          node scripts/report-size.mjs --json "$RUNNER_TEMP/head-size.json"

      - name: Measure the base branch
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git checkout --force ${{ github.event.pull_request.base.sha }}
          npm ci
          npm run build
          if [ -d packages/vue ]; then cd packages/vue; fi
          node "$RUNNER_TEMP/report-size.mjs" --json "$RUNNER_TEMP/base-size.json"

      - name: Report
        run: |
          if [ -f "$RUNNER_TEMP/base-size.json" ]; then
            node "$RUNNER_TEMP/report-size.mjs" \
              --current "$RUNNER_TEMP/head-size.json" \
              --base "$RUNNER_TEMP/base-size.json" >> "$GITHUB_STEP_SUMMARY"
          else
            node "$RUNNER_TEMP/report-size.mjs" \
              --current "$RUNNER_TEMP/head-size.json" >> "$GITHUB_STEP_SUMMARY"
          fi

  vue-compatibility:
    runs-on: ubuntu-latest
    name: vue ${{ matrix.vue }}
    strategy:
      fail-fast: false
      matrix:
        vue: ['3.2.0', '^3.5.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspace @swipi/core --workspace swipi-vue

      - name: Pin Vue ${{ matrix.vue }}
        run: |
          npm install --no-save --no-package-lock --legacy-peer-deps \
            vue@${{ matrix.vue }}

      - name: Test the adapter
        run: npm run test:run --workspace swipi-vue

      - name: Typecheck the public API
        run: npm run typecheck:package --workspace swipi-vue
