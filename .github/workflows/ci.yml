name: CI

on:
  workflow_dispatch:
    inputs:
      all:
        description: Run every check, whatever changed
        type: boolean
        default: true
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      react: ${{ steps.areas.outputs.react }}
      vue: ${{ steps.areas.outputs.vue }}
      svelte: ${{ steps.areas.outputs.svelte }}
      angular: ${{ steps.areas.outputs.angular }}
      pages: ${{ steps.areas.outputs.pages }}
      areas: ${{ steps.areas.outputs.areas }}
      sizes: ${{ steps.areas.outputs.sizes }}
      packages: ${{ steps.areas.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out the changed areas
        id: areas
        uses: ./.github/actions/changed-areas
        with:
          all: ${{ inputs.all || 'false' }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  checks:
    needs: changes
    if: needs.changes.outputs.areas != '[]'
    runs-on: ubuntu-latest
    name: checks ${{ matrix.area.name }}
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJSON(needs.changes.outputs.areas) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck ${{ matrix.area.workspaces }}

      - name: Test
        run: npm run test:run ${{ matrix.area.workspaces }}

      - name: Build
        run: npm run build ${{ matrix.area.workspaces }}

      - name: Verify the published package
        if: matrix.area.package != ''
        run: npm run verify:package --workspace ${{ matrix.area.package }}

  playgrounds:
    needs: changes
    if: needs.changes.outputs.pages == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the playgrounds
        run: npm run build:pages

  bundle-size:
    needs: changes
    if: needs.changes.outputs.sizes != '[]'
    uses: ./.github/workflows/bundle-size.yml
    with:
      packages: ${{ needs.changes.outputs.sizes }}

  compatibility:
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    uses: ./.github/workflows/compatibility.yml
    with:
      react: ${{ needs.changes.outputs.react == 'true' }}
      vue: ${{ needs.changes.outputs.vue == 'true' }}
      svelte: ${{ needs.changes.outputs.svelte == 'true' }}
      angular: ${{ needs.changes.outputs.angular == 'true' }}
