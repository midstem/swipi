name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Verify the published package
        run: npm run verify:package

      - name: Build the playgrounds
        run: npm run build:pages

  bundle-size-engine:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Measure this branch
        working-directory: packages/core
        run: |
          cp ../../tools/scripts/report-size.mjs "$RUNNER_TEMP/report-size.mjs"
          node "$RUNNER_TEMP/report-size.mjs" --json "$RUNNER_TEMP/head-size.json"

      - name: Measure the base branch
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git checkout --force ${{ github.event.pull_request.base.sha }}
          npm ci
          npm run build
          if [ -d packages/core ]; then cd packages/core; fi
          node "$RUNNER_TEMP/report-size.mjs" --json "$RUNNER_TEMP/base-size.json"

      - name: Report
        run: |
          if [ -f "$RUNNER_TEMP/base-size.json" ]; then
            node "$RUNNER_TEMP/report-size.mjs" \
              --current "$RUNNER_TEMP/head-size.json" \
              --base "$RUNNER_TEMP/base-size.json" >> "$GITHUB_STEP_SUMMARY"
          else
            node "$RUNNER_TEMP/report-size.mjs" \
              --current "$RUNNER_TEMP/head-size.json" >> "$GITHUB_STEP_SUMMARY"
          fi

  bundle-size-react:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Measure this branch
        working-directory: packages/react
        run: |
          cp ../../tools/scripts/report-size.mjs "$RUNNER_TEMP/report-size.mjs"
          node "$RUNNER_TEMP/report-size.mjs" --json "$RUNNER_TEMP/head-size.json"

      - name: Measure the base branch
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git checkout --force ${{ github.event.pull_request.base.sha }}
          npm ci
          npm run build
          if [ -d packages/react ]; then cd packages/react; fi
          node "$RUNNER_TEMP/report-size.mjs" --json "$RUNNER_TEMP/base-size.json"

      - name: Report
        run: |
          if [ -f "$RUNNER_TEMP/base-size.json" ]; then
            node "$RUNNER_TEMP/report-size.mjs" \
              --current "$RUNNER_TEMP/head-size.json" \
              --base "$RUNNER_TEMP/base-size.json" >> "$GITHUB_STEP_SUMMARY"
          else
            node "$RUNNER_TEMP/report-size.mjs" \
              --current "$RUNNER_TEMP/head-size.json" >> "$GITHUB_STEP_SUMMARY"
          fi

  react-compatibility:
    runs-on: ubuntu-latest
    name: react ${{ matrix.react }}
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pin React ${{ matrix.react }}
        run: |
          npm install --no-save --no-package-lock \
            react@${{ matrix.react }} \
            react-dom@${{ matrix.react }} \
            @types/react@${{ matrix.react }} \
            @types/react-dom@${{ matrix.react }}

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Typecheck the public API
        run: npm run typecheck:package

  bundle-size-vue:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Measure this branch
        working-directory: packages/vue
        run: |
          cp ../../tools/scripts/report-size.mjs "$RUNNER_TEMP/report-size.mjs"
          node "$RUNNER_TEMP/report-size.mjs" --json "$RUNNER_TEMP/head-size.json"

      - name: Measure the base branch
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git checkout --force ${{ github.event.pull_request.base.sha }}
          npm ci
          npm run build
          if [ -d packages/vue ]; then cd packages/vue; fi
          node "$RUNNER_TEMP/report-size.mjs" --json "$RUNNER_TEMP/base-size.json"

      - name: Report
        run: |
          if [ -f "$RUNNER_TEMP/base-size.json" ]; then
            node "$RUNNER_TEMP/report-size.mjs" \
              --current "$RUNNER_TEMP/head-size.json" \
              --base "$RUNNER_TEMP/base-size.json" >> "$GITHUB_STEP_SUMMARY"
          else
            node "$RUNNER_TEMP/report-size.mjs" \
              --current "$RUNNER_TEMP/head-size.json" >> "$GITHUB_STEP_SUMMARY"
          fi

  vue-compatibility:
    runs-on: ubuntu-latest
    name: vue ${{ matrix.vue }}
    strategy:
      fail-fast: false
      matrix:
        vue: ['3.2.0', '^3.5.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspace @midstem/swipi --workspace @midstem/swipi-vue

      - name: Pin Vue ${{ matrix.vue }}
        run: |
          npm install --no-save --no-package-lock --legacy-peer-deps \
            vue@${{ matrix.vue }}

      - name: Test the adapter
        run: npm run test:run --workspace @midstem/swipi-vue

      - name: Typecheck the public API
        run: npm run typecheck:package --workspace @midstem/swipi-vue

  bundle-size-svelte:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Measure this branch
        working-directory: packages/svelte
        run: |
          cp ../../tools/scripts/report-size.mjs "$RUNNER_TEMP/report-size.mjs"
          node "$RUNNER_TEMP/report-size.mjs" --json "$RUNNER_TEMP/head-size.json"

      - name: Measure the base branch
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git checkout --force ${{ github.event.pull_request.base.sha }}
          npm ci
          npm run build
          if [ -d packages/svelte ]; then cd packages/svelte; fi
          node "$RUNNER_TEMP/report-size.mjs" --json "$RUNNER_TEMP/base-size.json"

      - name: Report
        run: |
          if [ -f "$RUNNER_TEMP/base-size.json" ]; then
            node "$RUNNER_TEMP/report-size.mjs" \
              --current "$RUNNER_TEMP/head-size.json" \
              --base "$RUNNER_TEMP/base-size.json" >> "$GITHUB_STEP_SUMMARY"
          else
            node "$RUNNER_TEMP/report-size.mjs" \
              --current "$RUNNER_TEMP/head-size.json" >> "$GITHUB_STEP_SUMMARY"
          fi

  svelte-compatibility:
    runs-on: ubuntu-latest
    name: svelte ${{ matrix.svelte }}
    strategy:
      fail-fast: false
      matrix:
        svelte: ['4', '^5.0.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspace @midstem/swipi --workspace @midstem/swipi-svelte

      - name: Pin Svelte ${{ matrix.svelte }}
        run: |
          npm install --no-save --no-package-lock --legacy-peer-deps \
            svelte@${{ matrix.svelte }}

      - name: Test the adapter
        run: npm run test:run --workspace @midstem/swipi-svelte

      - name: Typecheck the public API
        run: npm run typecheck:package --workspace @midstem/swipi-svelte

  bundle-size-angular:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Measure this branch
        working-directory: packages/angular
        run: |
          cp ../../tools/scripts/report-size.mjs "$RUNNER_TEMP/report-size.mjs"
          node "$RUNNER_TEMP/report-size.mjs" --json "$RUNNER_TEMP/head-size.json"

      - name: Measure the base branch
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git checkout --force ${{ github.event.pull_request.base.sha }}
          npm ci
          npm run build
          if [ -d packages/angular ]; then cd packages/angular; fi
          node "$RUNNER_TEMP/report-size.mjs" --json "$RUNNER_TEMP/base-size.json"

      - name: Report
        run: |
          if [ -f "$RUNNER_TEMP/base-size.json" ]; then
            node "$RUNNER_TEMP/report-size.mjs" \
              --current "$RUNNER_TEMP/head-size.json" \
              --base "$RUNNER_TEMP/base-size.json" >> "$GITHUB_STEP_SUMMARY"
          else
            node "$RUNNER_TEMP/report-size.mjs" \
              --current "$RUNNER_TEMP/head-size.json" >> "$GITHUB_STEP_SUMMARY"
          fi

  angular-compatibility:
    runs-on: ubuntu-latest
    name: angular ${{ matrix.angular }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - angular: '17'
            adapter-tests: false
          - angular: '^22.0.0'
            adapter-tests: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspace @midstem/swipi --workspace @midstem/swipi-angular

      - name: Pin Angular ${{ matrix.angular }}
        run: |
          npm install --no-save --no-package-lock --legacy-peer-deps \
            @angular/core@${{ matrix.angular }}

      - name: Test the adapter
        if: matrix.adapter-tests
        run: npm run test:run --workspace @midstem/swipi-angular

      - name: Typecheck the public API
        run: npm run typecheck:package --workspace @midstem/swipi-angular
