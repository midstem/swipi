name: CI

on:
  workflow_dispatch:
    inputs:
      all:
        description: Run every check, whatever changed
        type: boolean
        default: true
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      react: ${{ steps.areas.outputs.react }}
      vue: ${{ steps.areas.outputs.vue }}
      svelte: ${{ steps.areas.outputs.svelte }}
      angular: ${{ steps.areas.outputs.angular }}
      pages: ${{ steps.areas.outputs.pages }}
      areas: ${{ steps.areas.outputs.areas }}
      sizes: ${{ steps.areas.outputs.sizes }}
      packages: ${{ steps.areas.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out the changed areas
        id: areas
        uses: ./.github/actions/changed-areas
        with:
          all: ${{ inputs.all || 'false' }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  checks:
    needs: changes
    if: needs.changes.outputs.areas != '[]'
    runs-on: ubuntu-latest
    name: checks ${{ matrix.area.name }}
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJSON(needs.changes.outputs.areas) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck ${{ matrix.area.workspaces }}

      - name: Test
        id: test
        run: |
          npm run test:run ${{ matrix.area.workspaces }} -- \
            --reporter=default \
            --reporter=github-actions \
            --reporter=json \
            --outputFile=vitest-report.json

      - name: Collect the failing tests
        if: failure() && steps.test.outcome == 'failure'
        env:
          NAME: ${{ matrix.area.name }}
        run: |
          node tools/scripts/report-tests.mjs --name "$NAME" > "failing-tests-$NAME.md"
          cat "failing-tests-$NAME.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the failing tests
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: report-failing-tests-${{ matrix.area.name }}
          path: failing-tests-${{ matrix.area.name }}.md
          if-no-files-found: ignore
          retention-days: 1

      - name: Build
        run: npm run build ${{ matrix.area.workspaces }}

      - name: Verify the published package
        if: matrix.area.package != ''
        run: npm run verify:package --workspace ${{ matrix.area.package }}

  playgrounds:
    needs: changes
    if: needs.changes.outputs.pages == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the playgrounds
        run: npm run build:pages

  bundle-size:
    needs: changes
    if: needs.changes.outputs.sizes != '[]'
    uses: ./.github/workflows/bundle-size.yml
    with:
      packages: ${{ needs.changes.outputs.sizes }}

  compatibility:
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    uses: ./.github/workflows/compatibility.yml
    with:
      react: ${{ needs.changes.outputs.react == 'true' }}
      vue: ${{ needs.changes.outputs.vue == 'true' }}
      svelte: ${{ needs.changes.outputs.svelte == 'true' }}
      angular: ${{ needs.changes.outputs.angular == 'true' }}

  report:
    needs: [checks, bundle-size]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download the reports
        uses: actions/download-artifact@v4
        with:
          path: reports
          pattern: report-*
          merge-multiple: true

      - name: Comment on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const { readdirSync, readFileSync, existsSync } = require('fs')

            const MARKER = '<!-- swipi-ci-report -->'

            const read = (prefix) =>
              (existsSync('reports') ? readdirSync('reports') : [])
                .filter((file) => file.startsWith(prefix))
                .sort()
                .map((file) => readFileSync(`reports/${file}`, 'utf8').trim())
                .filter(Boolean)

            const section = (heading, parts) =>
              parts.length ? [heading, ...parts].join('\n\n') : ''

            const body = [
              MARKER,
              section('## Failing tests', read('failing-tests-')),
              section('## Bundle size', read('bundle-size-'))
            ]
              .filter(Boolean)
              .join('\n\n')

            const issue = { ...context.repo, issue_number: context.issue.number }

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { ...issue, per_page: 100 }
            )

            const existing = comments.find((comment) =>
              comment.body?.includes(MARKER)
            )

            if (body === MARKER) {
              if (existing) {
                await github.rest.issues.updateComment({
                  ...context.repo,
                  comment_id: existing.id,
                  body: `${MARKER}\n\nNothing to report for this run.`
                })
              }

              return
            }

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body
              })

              return
            }

            await github.rest.issues.createComment({ ...issue, body })
