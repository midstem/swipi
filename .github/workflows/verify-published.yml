name: Validation of publication readiness

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  consumer-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        package: [swipi, swipi-vue]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the tarball in a real app
        run: npm run verify:published --workspace ${{ matrix.package }}
