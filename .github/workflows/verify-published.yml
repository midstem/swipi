name: Validation of publication readiness

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  consumer-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        package:
          [
            '@midstem/swipi-react',
            '@midstem/swipi-vue',
            '@midstem/swipi-svelte'
          ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the tarball in a real app
        run: npm run verify:published --workspace ${{ matrix.package }}
