name: build

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Read the package out of the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: .github/scripts/check-release-version.sh

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Verify the package contents
        run: npm run verify:package --workspace "$PACKAGE"

      - name: Typecheck the public API
        run: npm run typecheck:package --workspace "$PACKAGE"

      - name: Verify the tarball in a real app
        run: npm run verify:published --workspace "$PACKAGE"

      - name: Publish
        run: npm publish --workspace "$PACKAGE" --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
